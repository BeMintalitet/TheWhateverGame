const EV={coins:[],gift:null,ghost:null};
const EVENT_DEFS=[
  {key:'coinrain',w:3,ok:k=>['hop','flap','blast','trail','dodge','frog'].includes(k),
   run(){G.rainT=5;say("COIN RAIN. touch them, tap them, whatever works.",2.4);}},
  {key:'ghost',w:3,ok:k=>!['pet','copy','stack'].includes(k),
   run(){EV.ghost={x:-30,y:clamp(P.y+rand(-60,60),SAFE_TOP()+60,H-60),vx:300+G.cycle*30};say("a golden whatever! catch it — or just tap it!",2);}},
  {key:'gift',w:3,ok:k=>k!=='pet',
   run(){EV.gift={x:rand(60,W-60),y:-30,vy:110,spin:0};say("incoming gift. can't reach? tap it.",2);}},
  {key:'warp',w:2,ok:k=>k!=='pet',
   run(){G.invuln=Math.max(G.invuln,1.1);shake(4,0.3);SFX.pop();
     say(vchoose(["TIME WARP. reality stutters — you're briefly untouchable.","everything just... paused. use it.","a glitch in your favor. rare. enjoy it."]),2.4);}},
];
function triggerEvent(){
  const pool=EVENT_DEFS.filter(e=>e.ok(cur.key));
  if(!pool.length)return;
  let tw=0;for(const e of pool)tw+=e.w;
  let r=rng()*tw;
  for(const e of pool){r-=e.w;if(r<=0){e.run();break;}}
}
function openGift(gf){
  SFX.heart();confetti(gf.x,gf.y);
  const roll=rng();
  if(roll<0.25)addScore(200,gf.x,gf.y,'GIFT');
  else if(roll<0.45){G.magnetT=12;say("coin magnet! physics disagrees but whatever.",2.2);}
  else if(roll<0.65){G.doubleT=10;say("DOUBLE SCORE. ten seconds. move.",2.2);}
  else if(roll<0.8){if(!G.shield){G.shield=true;say("a shield! it matches your everything.",2.2);}else addScore(150,gf.x,gf.y,'GIFT');}
  else if(roll<0.9)gainHeart();
  else{say("the box was empty. the real gift was disappointment.",2.4);addScore(5,gf.x,gf.y,'lol');}
}
/* pickups are tappable everywhere — some genres pin the character, the finger is never pinned */
function tapCollect(){
  if(!G||state!=='play')return false;
  const R=IN.touch?30:22;
  let got=false;
  for(let i=EV.coins.length-1;i>=0;i--){const c=EV.coins[i];
    if(dist2(IN.px,IN.py,c.x,c.y)<(R+10)**2){EV.coins.splice(i,1);
      addScore(20,c.x,c.y);bumpCombo();G.coins++;SFX.coin();collectFX(c.x,c.y,'#ffd94d');got=true;}}
  if(EV.ghost&&dist2(IN.px,IN.py,EV.ghost.x,EV.ghost.y)<(R+16)**2){
    const g=EV.ghost;addScore(150,g.x,g.y,'GHOST');bumpCombo();collectFX(g.x,g.y,'#ffd94d');SFX.heart();
    if(!G.shield){G.shield=true;say("the ghost left you a shield. ghosts are nice here.",2.2);}
    else addScore(100,g.x,g.y);
    EV.ghost=null;got=true;}
  if(EV.gift&&dist2(IN.px,IN.py,EV.gift.x,EV.gift.y)<(R+18)**2){openGift(EV.gift);EV.gift=null;got=true;}
  return got;
}
const PINNED=['hop','flap','beat','copy','stack']; // modes where the character can't roam
function updateEvents(dt,t){
  const pinned=cur&&PINNED.includes(cur.key);
  if(G.rainT>0){G.rainT-=dt;
    if(Math.random()<0.25)EV.coins.push({x:vrand(20,W-20),y:SAFE_TOP()-10,vy:vrand(200,300),sw:vrand(0,TAU)});}
  for(let i=EV.coins.length-1;i>=0;i--){const c=EV.coins[i];
    c.y+=c.vy*dt;c.x+=Math.sin(t*4+c.sw)*0.8;magnetize(c,dt);
    if(pinned)c.x+=clamp(P.x-c.x,-70,70)*dt*0.9; // drift toward the pinned character's column
    if(c.y>H+20){EV.coins.splice(i,1);continue;}
    if(dist2(P.x,P.y,c.x,c.y)<(P.r+12)**2){EV.coins.splice(i,1);
      addScore(20,c.x,c.y);bumpCombo();G.coins++;SFX.coin();collectFX(c.x,c.y,'#ffd94d');}}
  if(EV.ghost){const g=EV.ghost;g.x+=g.vx*dt;
    if(g.x>W+40)EV.ghost=null;
    else if(dist2(P.x,P.y,g.x,g.y)<(P.r+14)**2){
      addScore(150,g.x,g.y,'GHOST');bumpCombo();collectFX(g.x,g.y,'#ffd94d');SFX.heart();
      if(!G.shield){G.shield=true;say("the ghost left you a shield. ghosts are nice here.",2.2);}
      else addScore(100,g.x,g.y);
      EV.ghost=null;}}
  if(EV.gift){const gf=EV.gift;gf.y+=gf.vy*dt;gf.spin+=dt*3;
    if(pinned)gf.x+=clamp(P.x-gf.x,-60,60)*dt*0.7;
    if(gf.y>H+30)EV.gift=null;
    else if(dist2(P.x,P.y,gf.x,gf.y)<(P.r+16)**2){openGift(gf);EV.gift=null;}}
}

  if(state!=='play')return;
  if(cur===ModePaddle&&ModePaddle.builtW&&ModePaddle.builtW!==W){
    const k=W/ModePaddle.builtW;
    for(const b of ModePaddle.bricks){b.x*=k;b.w*=k;}
    ModePaddle.px=clamp(ModePaddle.px*k,ModePaddle.pw/2,W-ModePaddle.pw/2);
    ModePaddle.builtW=W;
  }
  if(cur===ModeBoss)ModeBoss.ph=Math.max(80,H*0.16);

    const k=W/ModeStack.builtW;

    if(ModeStack.mover){ModeStack.mover.x*=k;ModeStack.mover.w*=k;}
    ModeStack.builtW=W;

  if(cur===ModeDefend&&ModeDefend.domes&&ModeDefend.domes.length){
    const fr=[0.16,0.4,0.62,0.86];
    ModeDefend.domes.forEach((d,i)=>{if(fr[i]!==undefined)d.x=W*fr[i];});
  }
  if(cur===ModeMaze&&ModeMaze.grid.length){
    // grid/dots are stored in cell coordinates (resolution-independent) — only the pixel transform needs redoing
    const pgx=Math.floor((P.x-ModeMaze.ox)/ModeMaze.cell),pgy=Math.floor((P.y-ModeMaze.oy)/ModeMaze.cell);
    ModeMaze.cell=Math.max(20,Math.min(32,Math.min(W,H-SAFE_TOP())/13));

    ModeMaze.oy=SAFE_TOP()+10+Math.max(0,(H-SAFE_TOP()-20-ModeMaze.rows*ModeMaze.cell)/2);
    P.x=ModeMaze.cx(pgx);P.y=ModeMaze.cy(pgy);
  }
});

const glitchBuf=document.createElement('canvas');
const glitchCtx=glitchBuf.getContext('2d');
function drawMorphFX(){
  if(morphT<=0)return;
  const p=morphT/1.2; // 1→0
  const intensity=Math.sin(p*Math.PI); // peak mid
  // slice displacement — via snapshot buffer (self-drawImage is slow on mobile GPUs)
  const slices=8;
  if(intensity>0.05){
    if(glitchBuf.width!==cv.width||glitchBuf.height!==cv.height){glitchBuf.width=cv.width;glitchBuf.height=cv.height;}
    glitchCtx.drawImage(cv,0,0);
    for(let i=0;i<slices;i++){
      if(Math.random()<intensity*0.9){
        const sy=Math.random()*H,sh=vrand(6,40);
        const off=vrand(-40,40)*intensity;
        ctx.drawImage(glitchBuf,0,sy*DPR,cv.width,sh*DPR,off,sy,W,sh);
      }
    }
    // rgb tint bars
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=intensity*0.15;
    ctx.fillStyle='#f0f';ctx.fillRect(0,vrand(0,H),W,vrand(2,10));
    ctx.fillStyle='#0ff';ctx.fillRect(0,vrand(0,H),W,vrand(2,10));
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
    // noise sprinkle
    ctx.fillStyle='rgba(255,255,255,0.5)';
    for(let i=0;i<intensity*30;i++)ctx.fillRect(Math.random()*W,Math.random()*H,2,2);
  }
  // white flash at swap moment
  const flash=1-Math.abs(p-0.5)*2;
  if(flash>0.55){ctx.fillStyle=`rgba(255,255,255,${(flash-0.55)*1.4})`;ctx.fillRect(0,0,W,H);}
}

let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  dt=Math.min(dt,0.05);
  const t=now/1000;
  if(freezeT>0){freezeT-=dt;dt=0;}
  updateAxis(dt);
  ctx.save();
  if(shakeT>0){shakeT-=dt||0.016;const s=shakeAmt*(shakeT/shakeDur);ctx.translate(vrand(-s,s),vrand(-s,s));if(shakeT<=0)shakeAmt=0;}
  if(postRunPending>0){postRunPending-=dt;if(postRunPending<=0)runPostRunAds();}
  updateToasts(dt);
  if(titleBackArm>0)titleBackArm-=dt;
  if(PAUSED&&state==='play'){
    // hold the last frame, then the overlay. nothing simulates.
    drawBG(t);cur.draw(t);drawEvents(t);drawFX();drawNight();WORLD().post(t);
    drawHUD();drawCaption();
    drawPauseOverlay();drawToasts();
    ctx.restore();return;
  }
  if(state==='badges'){overT+=dt;scrollUpdate(dt);drawBadges(t);drawToasts();ctx.restore();return;}
  if(state==='skins'){overT+=dt;scrollUpdate(dt);drawSkins(t);drawToasts();ctx.restore();return;}
  if(state==='profile'){overT+=dt;scrollUpdate(dt);drawProfile(t);drawToasts();ctx.restore();return;}
  if(state==='title'){titleT+=dt;drawTitle(t);}
  else if(state==='play'){
    G.t+=dt;G.modeT+=dt;G.idleT+=dt;
    G.comboT-=dt;if(G.comboT<=0)G.combo=Math.max(0,G.combo-1),G.comboT=0.5;
    if(G.invuln>0)G.invuln-=dt;
    if(G.magnetT>0)G.magnetT-=dt;
    if(G.doubleT>0)G.doubleT-=dt;
    if(G.worldBannerT>0)G.worldBannerT-=dt;
    if(G.idleT>14){say(vchoose(QUIPS.bored),2.4);G.idleT=0;}
    updateMorph(dt);
    const inBoss=BOSSES.includes(cur);
    if(morphT<=0&&!inBoss&&!SURV&&G.modeT>=G.modeDur*(cur.durMul||1))beginMorph();
    if(SURV&&morphT<=0){ // survival ramp: endless, ever faster
      G.speedMul=Math.min(2.0,(1+G.modeT*0.006)*(WORLD().spd||1));
      const cyc=Math.floor(G.modeT/40);
      if(cyc>G.cycle&&!inBoss){
        G.cycle=Math.min(cyc,12);SFX.win();shake(4,0.2);
        say(vchoose(["DIFFICULTY UP. the game grows teeth.","faster. meaner. still just this game.","LVL "+(cyc+1)+". no morphing. only consequences."]),2.4);
        if(cur.key!=='pet'&&cur.key!=='flux'){G.eventFired=false;G.eventAt=G.modeT+rand(4,9);}
      }
      if(G.eventFired&&!inBoss&&cur.key!=='pet'&&cur.key!=='flux'&&G.modeT>G.eventAt+20){
        G.eventFired=false;G.eventAt=G.modeT+rand(4,9); // surprises keep coming
      }
    }
    if(!G.eventFired&&!inBoss&&morphT<=0&&G.modeT>G.eventAt){G.eventFired=true;triggerEvent();}
    if(morphT<=0||morphT<0.6)cur.update(dt);
    updateEvents(dt,t);
    updateBitFace(dt);updateFX(dt);updateCaption(dt);
    // music
    if(AC&&AC.state==='running'){
      const bpm=cur.bpm*(G.speedMul*0.5+0.5);
      const beatLen=60/bpm/2;
      const idx=Math.floor(G.t/beatLen);
      if(idx>musicBeatDone){musicBeatDone=idx;scheduleMusicBeat(idx,AC.currentTime+0.02);}
    }
    drawBG(t);
    cur.draw(t);
    drawEvents(t);
    drawFX();
    drawNight();
    WORLD().post(t);
    drawHUD();drawModeBanner();drawWorldBanner(t);drawCaption();
    drawMorphFX();
  }
  else if(state==='over'){
    overT+=dt;updateFX(dt);
    drawOver(t);drawFX();
  }
  else if(state==='pick'){overT+=dt;drawPick(t);}
  else if(state==='entry'){overT+=dt;drawEntry(t);}
  else if(state==='board'){overT+=dt;updateFX(dt);drawBoard(t);drawFX();}
  else if(state==='vshand'){overT+=dt;drawVsHand(t);}
  else if(state==='vsresult'){overT+=dt;updateFX(dt);drawVsResult(t);drawFX();}
  if(continueOffer)continueOffer.t+=dt;
  drawToasts();
  ctx.restore();
}

/* ---- typed, validated loader (audit: loadSave did no type checks) ---- */
function loadTyped(key,fallback,kind){
  const v=loadSave(key,undefined);
  if(v===undefined||v===null)return fallback;
  if(kind==='array')return Array.isArray(v)?v:fallback;
  if(kind==='object')return (v&&typeof v==='object'&&!Array.isArray(v))?v:fallback;
  if(kind==='number')return (typeof v==='number'&&isFinite(v))?v:fallback;
  if(kind==='string')return typeof v==='string'?v:fallback;
  return v;
}

  else if(typeof ST[k]!=='number'||!isFinite(ST[k]))ST[k]=d;

let statsDirty=false;
function saveStats(){statsDirty=true;}
function flushStats(force){
  if(!statsDirty&&!force)return;
  statsDirty=false;
  writeSave('stats',ST);
  writeSave('ver',SAVE_VER);
}
function bump(obj,key,by){obj[key]=(obj[key]||0)+(by===undefined?1:by);}

/* ---- migration from v1 ---- */
(function migrate(){

  ST.bestScore=Math.max(ST.bestScore,sessionBest||0);

/* ---- currency ---- */
function addBits(n,silent){
  n=Math.max(0,Math.round(n));if(!n)return;
  ST.bits+=n;ST.bitsEarned+=n;saveStats();
  if(!silent&&typeof floaters!=='undefined')floaters.push({x:W/2,y:H*0.42,t:0,txt:'+'+n+' ✦',c:'#ffd94d'});
}
function spendBits(n){if(ST.bits<n)return false;ST.bits-=n;saveStats();flushStats(true);return true;}

/* ---- prestige rank off lifetime XP ---- */
function rankFor(xp){return Math.max(1,Math.floor(Math.pow(Math.max(0,xp)/450,0.62))+1);}
function rankXpFloor(r){return Math.ceil(Math.pow(Math.max(0,r-1),1/0.62)*450);}
function addXP(n){
  if(!(n>0))return;
  const before=ST.rank;
  ST.xp+=Math.round(n);
  ST.rank=rankFor(ST.xp);
  if(ST.rank>before){
    addBits(40*(ST.rank-before),true);
    pushToast('RANK '+ST.rank,'+'+(40*(ST.rank-before))+' ✦','#c084fc');
  }
  saveStats();
}

/* ---- per-mode mastery: XP -> level 0..10 ---- */
const MASTERY_MAX=10;
function masteryLevel(key){
  const xp=ST.modeXP[key]||0;
  if(xp<=0)return 0;
  return Math.max(1,Math.min(MASTERY_MAX,Math.floor(Math.pow(xp/300,0.55))+1));
}
function masteryNeed(lvl){return Math.ceil(Math.pow(Math.max(0,lvl-1),1/0.55)*300);}
function addModeXP(key,n){
  if(!key||!(n>0))return;
  const before=masteryLevel(key);
  bump(ST.modeXP,key,Math.round(n));
  const after=masteryLevel(key);
  if(after>before){
    addBits(25*(after-before),true);
    pushToast('MASTERY '+after,(MODE_BY_KEY[key]?MODE_BY_KEY[key].name:key),'#4dffa6');
  }
}

/* ---- daily login streak ---- */
function todayIdx(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);}
let loginReward=null;
(function checkLogin(){
  const today=todayIdx(),lastDay=ST.lastLogin||0;
  if(lastDay===today)return;
  ST.loginStreak=(today-lastDay===1)?ST.loginStreak+1:1;
  ST.loginBest=Math.max(ST.loginBest,ST.loginStreak);
  ST.lastLogin=today;ST.loginDays++;
  const reward=[0,15,25,40,60,85,120,180][Math.min(7,ST.loginStreak)];
  ST.bits+=reward;ST.bitsEarned+=reward;
  loginReward={day:ST.loginStreak,bits:reward};
  saveStats();flushStats(true);
})();

];
let CONTRACTS=[];
(function rollContracts(){
  const today=todayIdx();
  const saved=loadTyped('contracts',null,'object');
  if(saved&&saved.day===today&&Array.isArray(saved.list)){CONTRACTS=saved.list;return;}
  let s=(today*2654435761)%2147483647;
  const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
  const pool=CONTRACT_POOL.slice();
  CONTRACTS=[];
  for(let i=0;i<3&&pool.length;i++){
    const def=pool.splice(Math.floor(rnd()*pool.length),1)[0];
    const tier=Math.floor(rnd()*3);
    CONTRACTS.push({id:def.id,tier,n:def.n[tier],done:false,bits:Math.round(def.bits*(1+tier*0.6))});
  }
  writeSave('contracts',{day:today,list:CONTRACTS});
})();
function contractDef(id){return CONTRACT_POOL.find(c=>c.id===id);}
function contractText(c){const d=contractDef(c.id);return d?d.txt(c):'???';}
function saveContracts(){writeSave('contracts',{day:todayIdx(),list:CONTRACTS});}
function checkContracts(r){
  let any=false;
  for(const c of CONTRACTS){
    if(c.done)continue;
    const def=contractDef(c.id);if(!def)continue;
    if(def.test(c,r)){
      c.done=true;addBits(c.bits,true);bump(ST,'contractsDone');
      pushToast('CONTRACT DONE','+'+c.bits+' ✦','#ffd94d');any=true;
    }
  }
  if(any)saveContracts();
}

/* ---- toast queue ---- */
let TOASTS=[];
function pushToast(title,sub,col){
  TOASTS.push({title,sub:sub||'',col:col||'#fff',t:0,life:2.8});
  if(TOASTS.length>4)TOASTS.splice(0,TOASTS.length-4);
}
function updateToasts(dt){
  for(let i=TOASTS.length-1;i>=0;i--){TOASTS[i].t+=dt;if(TOASTS[i].t>TOASTS[i].life)TOASTS.splice(i,1);}
}
function roundRect(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawToasts(){
  if(!TOASTS.length)return;
  const u=UIS();
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<TOASTS.length;i++){
    const T=TOASTS[i],p=T.t/T.life;
    let a=1;
    if(p<0.09)a=p/0.09; else if(p>0.82)a=(1-p)/0.18;
    const w=Math.min(W*0.8,300),h=T.sub?54:38;
    const x=W/2-w/2,y=SAFE_TOP()+70+i*(h+8)-(1-Math.min(1,T.t/0.22))*14;
    ctx.globalAlpha=Math.max(0,a);
    ctx.fillStyle='rgba(8,8,18,0.9)';roundRect(x,y,w,h,10);ctx.fill();
    ctx.strokeStyle=T.col;ctx.lineWidth=2;roundRect(x,y,w,h,10);ctx.stroke();
    ctx.fillStyle=T.col;ctx.font=`800 ${12*u}px -apple-system,system-ui,sans-serif`;
    ctx.fillText(T.title,W/2,y+(T.sub?17:h/2+1));
    if(T.sub){ctx.fillStyle='rgba(255,255,255,0.8)';ctx.font=`600 ${11*u}px -apple-system,system-ui,sans-serif`;
      ctx.fillText(T.sub.length>38?T.sub.slice(0,37)+'…':T.sub,W/2,y+36);}
  }
  ctx.restore();ctx.globalAlpha=1;
}


/* ======== MODULE 02_skins.js ======== */
/* ==================================================================
   SKIN ENGINE — 100 high-definition procedural player skins.
   Everything is vector + gradient, so it stays crisp at any DPR and
   costs a few hundred bytes instead of a sprite atlas.
   Layer order: AURA -> BODY(shape+surface) -> PATTERN -> FACE -> HAT -> RIM
   ================================================================== */
const SKIN_GRAD_CACHE=new Map();
function gcache(key,make){
  let g=SKIN_GRAD_CACHE.get(key);
  if(!g){g=make();SKIN_GRAD_CACHE.set(key,g);if(SKIN_GRAD_CACHE.size>260)SKIN_GRAD_CACHE.clear();}
  return g;
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(amt>0){r+=(255-r)*amt;g+=(255-g)*amt;b+=(255-b)*amt;}
  else{r*=(1+amt);g*=(1+amt);b*=(1+amt);}
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

/* ---------------- BODY SHAPES (path only, centred at 0,0) ---------------- */
const SHAPES={
  orb(rx,ry){ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,TAU);},
  egg(rx,ry){ctx.beginPath();ctx.ellipse(0,ry*0.08,rx*0.94,ry,0,0,TAU);},
  blob(rx,ry,t){
    ctx.beginPath();
    for(let i=0;i<=28;i++){
      const a=i/28*TAU;
      const w=1+Math.sin(a*3+t*1.6)*0.055+Math.sin(a*5-t*1.1)*0.035;
      const x=Math.cos(a)*rx*w,y=Math.sin(a)*ry*w;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();
  },
  gem(rx,ry){
    ctx.beginPath();
    ctx.moveTo(0,-ry);ctx.lineTo(rx*0.92,-ry*0.22);ctx.lineTo(rx*0.58,ry*0.92);
    ctx.lineTo(-rx*0.58,ry*0.92);ctx.lineTo(-rx*0.92,-ry*0.22);ctx.closePath();
  },
  cube(rx,ry){const k=rx*0.9;roundRectPath(-k,-ry*0.9,k*2,ry*1.8,rx*0.22);},
  hex(rx,ry){
    ctx.beginPath();
    for(let i=0;i<6;i++){const a=i/6*TAU-Math.PI/2;
      const x=Math.cos(a)*rx,y=Math.sin(a)*ry;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.closePath();
  },
  star(rx,ry){
    ctx.beginPath();
    for(let i=0;i<10;i++){const a=i/10*TAU-Math.PI/2,rr=i%2?0.48:1;
      const x=Math.cos(a)*rx*rr,y=Math.sin(a)*ry*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.closePath();
  },
  drop(rx,ry){
    ctx.beginPath();
    ctx.moveTo(0,-ry*1.25);
    ctx.bezierCurveTo(rx*0.85,-ry*0.35,rx,ry*0.35,0,ry);
    ctx.bezierCurveTo(-rx,ry*0.35,-rx*0.85,-ry*0.35,0,-ry*1.25);
    ctx.closePath();
  },
  ghost(rx,ry){
    ctx.beginPath();
    ctx.arc(0,-ry*0.12,rx,Math.PI,0);
    ctx.lineTo(rx,ry*0.62);
    for(let i=0;i<4;i++){
      const x0=rx-(i*2+0)*rx/4,x1=rx-(i*2+1)*rx/4,x2=rx-(i*2+2)*rx/4;
      ctx.quadraticCurveTo(x1,ry*(i%2?0.34:1.02),x2,ry*0.62);
    }
    ctx.lineTo(-rx,-ry*0.12);ctx.closePath();
  },
  crystal(rx,ry){
    ctx.beginPath();
    ctx.moveTo(0,-ry*1.15);ctx.lineTo(rx*0.72,-ry*0.3);ctx.lineTo(rx*0.5,ry*0.98);
    ctx.lineTo(-rx*0.5,ry*0.98);ctx.lineTo(-rx*0.72,-ry*0.3);ctx.closePath();
  },
  flame(rx,ry,t){
    ctx.beginPath();
    ctx.moveTo(0,ry);
    ctx.bezierCurveTo(rx*1.05,ry*0.5,rx*0.62,-ry*0.35,rx*0.2+Math.sin(t*4)*rx*0.08,-ry*1.3);
    ctx.bezierCurveTo(rx*0.1,-ry*0.5,-rx*0.42,-ry*0.5,-rx*0.28,-ry*1.05);
    ctx.bezierCurveTo(-rx*0.95,-ry*0.4,-rx*1.05,ry*0.5,0,ry);
    ctx.closePath();
  },
  cat(rx,ry){
    ctx.beginPath();
    ctx.moveTo(-rx*0.66,-ry*0.5);ctx.lineTo(-rx*0.86,-ry*1.28);ctx.lineTo(-rx*0.16,-ry*0.86);
    ctx.lineTo(rx*0.16,-ry*0.86);ctx.lineTo(rx*0.86,-ry*1.28);ctx.lineTo(rx*0.66,-ry*0.5);
    ctx.quadraticCurveTo(rx*1.06,0,rx*0.72,ry*0.7);
    ctx.quadraticCurveTo(0,ry*1.18,-rx*0.72,ry*0.7);
    ctx.quadraticCurveTo(-rx*1.06,0,-rx*0.66,-ry*0.5);ctx.closePath();
  },
  shard(rx,ry){
    ctx.beginPath();
    ctx.moveTo(-rx*0.2,-ry*1.2);ctx.lineTo(rx*0.95,-ry*0.5);ctx.lineTo(rx*0.45,ry*1.1);
    ctx.lineTo(-rx*0.8,ry*0.6);ctx.lineTo(-rx*0.95,-ry*0.35);ctx.closePath();
  },
  ring(rx,ry){
    ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,TAU);
    ctx.ellipse(0,0,rx*0.42,ry*0.42,0,TAU,0,true);
  },
  crescent(rx,ry){
    ctx.beginPath();ctx.arc(0,0,rx,Math.PI*0.32,Math.PI*1.68);
    ctx.arc(rx*0.42,0,rx*0.86,Math.PI*1.62,Math.PI*0.38,true);ctx.closePath();
  },
  shield(rx,ry){
    ctx.beginPath();
    ctx.moveTo(0,-ry*1.05);ctx.lineTo(rx*0.95,-ry*0.6);
    ctx.quadraticCurveTo(rx*0.95,ry*0.5,0,ry*1.15);
    ctx.quadraticCurveTo(-rx*0.95,ry*0.5,-rx*0.95,-ry*0.6);ctx.closePath();
  },
  pixel(rx,ry){roundRectPath(-rx*0.92,-ry*0.92,rx*1.84,ry*1.84,rx*0.08);}
};
function roundRectPath(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

/* ---------------- SURFACES (fill the current path) ---------------- */
const SURFACES={
  gloss(S,r,t){
    const g=gcache('gl'+S.c1+S.c2+(r|0),()=>{
      const gr=ctx.createRadialGradient(-r*0.34,-r*0.42,r*0.06,0,0,r*1.24);
      gr.addColorStop(0,shade(S.c1,0.55));gr.addColorStop(0.42,S.c1);
      gr.addColorStop(1,shade(S.c2,-0.32));return gr;});
    ctx.fillStyle=g;ctx.fill();
  },
  matte(S,r){
    const g=gcache('mt'+S.c1+S.c2+(r|0),()=>{
      const gr=ctx.createLinearGradient(0,-r,0,r);
      gr.addColorStop(0,shade(S.c1,0.16));gr.addColorStop(1,shade(S.c2,-0.2));return gr;});
    ctx.fillStyle=g;ctx.fill();
  },
  metal(S,r){
    const g=gcache('me'+S.c1+S.c2+(r|0),()=>{
      const gr=ctx.createLinearGradient(-r,-r,r,r);
      gr.addColorStop(0,shade(S.c2,-0.4));gr.addColorStop(0.28,shade(S.c1,0.7));
      gr.addColorStop(0.45,S.c1);gr.addColorStop(0.6,shade(S.c2,-0.35));
      gr.addColorStop(0.78,shade(S.c1,0.5));gr.addColorStop(1,shade(S.c2,-0.5));return gr;});
    ctx.fillStyle=g;ctx.fill();
  },
  holo(S,r,t){
    const gr=ctx.createLinearGradient(-r,-r,r,r);
    const h=(t*36)%360;
    for(let i=0;i<=5;i++)gr.addColorStop(i/5,`hsl(${(h+i*62)%360} 92% ${58+Math.sin(i)*8}%)`);
    ctx.fillStyle=gr;ctx.fill();
    ctx.save();ctx.clip();
    ctx.globalAlpha=0.18;ctx.fillStyle='#fff';
    for(let y=-r;y<r;y+=r*0.22)ctx.fillRect(-r,y+((t*24)%(r*0.22)),r*2,r*0.05);
    ctx.restore();ctx.globalAlpha=1;
  },
  glass(S,r,t){
    const g=gcache('gs'+S.c1+(r|0),()=>{
      const gr=ctx.createRadialGradient(-r*0.3,-r*0.36,r*0.05,0,0,r*1.2);
      gr.addColorStop(0,hexA(S.c1,0.85));gr.addColorStop(0.55,hexA(S.c1,0.35));
      gr.addColorStop(1,hexA(S.c2,0.62));return gr;});
    ctx.fillStyle=g;ctx.fill();
    ctx.save();ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=Math.max(1,r*0.07);
    ctx.beginPath();ctx.arc(0,0,r*0.86,Math.PI*0.78,Math.PI*1.32);ctx.stroke();
    ctx.restore();
  },
  galaxy(S,r,t){
    const g=gcache('ga'+S.c1+S.c2+(r|0),()=>{
      const gr=ctx.createRadialGradient(r*0.12,-r*0.1,r*0.04,0,0,r*1.16);
      gr.addColorStop(0,shade(S.c1,0.7));gr.addColorStop(0.34,S.c1);
      gr.addColorStop(0.72,S.c2);gr.addColorStop(1,'#080714');return gr;});
    ctx.fillStyle=g;ctx.fill();
    ctx.save();ctx.clip();
    ctx.fillStyle='#fff';
    for(let i=0;i<16;i++){
      const a=i*2.399+t*0.22,rr=r*(0.16+((i*37)%100)/125);
      const s=0.6+Math.sin(t*3+i)*0.4;
      ctx.globalAlpha=0.35+s*0.5;
      ctx.fillRect(Math.cos(a)*rr,Math.sin(a)*rr,Math.max(0.8,r*0.05),Math.max(0.8,r*0.05));
    }
    ctx.restore();ctx.globalAlpha=1;
  },
  lava(S,r,t){
    const g=gcache('lv'+S.c1+S.c2+(r|0),()=>{
      const gr=ctx.createRadialGradient(-r*0.2,-r*0.3,r*0.05,0,0,r*1.2);
      gr.addColorStop(0,'#2a1008');gr.addColorStop(0.55,shade(S.c2,-0.5));
      gr.addColorStop(1,'#140505');return gr;});
    ctx.fillStyle=g;ctx.fill();
    ctx.save();ctx.clip();
    ctx.lineCap='round';
    for(let i=0;i<5;i++){
      const ph=t*1.4+i*1.7,a=0.55+Math.sin(ph)*0.4;
      ctx.strokeStyle=hexA(S.c1,a);ctx.lineWidth=Math.max(1,r*(0.09+Math.sin(ph)*0.03));
      ctx.beginPath();
      ctx.moveTo(-r,-r+i*r*0.44);
      ctx.bezierCurveTo(-r*0.3,-r*0.9+i*r*0.44,r*0.3,-r*0.2+i*r*0.44,r,-r*0.5+i*r*0.44);
      ctx.stroke();
    }
    ctx.restore();
  },
  ice(S,r,t){
    const g=gcache('ic'+S.c1+(r|0),()=>{
      const gr=ctx.createLinearGradient(-r*0.7,-r,r*0.6,r);
      gr.addColorStop(0,'#ffffff');gr.addColorStop(0.35,shade(S.c1,0.4));
      gr.addColorStop(1,shade(S.c2,-0.22));return gr;});
    ctx.fillStyle=g;ctx.fill();
    ctx.save();ctx.clip();
    ctx.strokeStyle='rgba(255,255,255,0.6)';ctx.lineWidth=Math.max(0.8,r*0.05);
    for(let i=0;i<4;i++){
      const a=i*0.9+0.4;
      ctx.beginPath();ctx.moveTo(-Math.cos(a)*r,-Math.sin(a)*r);ctx.lineTo(Math.cos(a+1.1)*r,Math.sin(a+1.1)*r);ctx.stroke();
    }
    ctx.restore();
  },
  circuit(S,r,t){
    const g=gcache('ci'+S.c2+(r|0),()=>{
      const gr=ctx.createLinearGradient(0,-r,0,r);
      gr.addColorStop(0,shade(S.c2,0.1));gr.addColorStop(1,shade(S.c2,-0.45));return gr;});
    ctx.fillStyle=g;ctx.fill();
    ctx.save();ctx.clip();
    ctx.strokeStyle=hexA(S.c1,0.55+Math.sin(t*4)*0.3);ctx.lineWidth=Math.max(0.9,r*0.055);
    ctx.lineJoin='round';
    for(let i=0;i<3;i++){
      const o=-r*0.6+i*r*0.6;
      ctx.beginPath();ctx.moveTo(-r,o);ctx.lineTo(-r*0.2,o);ctx.lineTo(0,o+r*0.3);ctx.lineTo(r*0.55,o+r*0.3);ctx.lineTo(r,o-r*0.1);ctx.stroke();
    }
    ctx.fillStyle=S.c1;

/* ---------------- FACE ---------------- */
function drawSkinFace(S,r,o){
  const lx=clamp(o.look,-1,1)*r*0.28, ly=clamp(o.lookY,-1,1)*r*0.22;
  const eyeC=S.eye||'#0a0a14';
  const ex=r*0.28, ey=-r*0.08;
  if(S.face==='visorface'){
    ctx.fillStyle=eyeC;
    roundRectPath(-r*0.62+lx,ey-r*0.14,r*1.24,r*0.28,r*0.13);ctx.fill();
    ctx.fillStyle=S.a||'#4dffa6';
    roundRectPath(-r*0.52+lx,ey-r*0.07,r*0.34,r*0.14,r*0.06);ctx.fill();
    roundRectPath(r*0.18+lx,ey-r*0.07,r*0.34,r*0.14,r*0.06);ctx.fill();
    return;
  }
  if(S.face==='cyclops'){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(lx,ey,r*0.34,0,TAU);ctx.fill();
    if(!o.blink){ctx.fillStyle=eyeC;ctx.beginPath();ctx.arc(lx+lx*0.2,ey+ly,r*0.17,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.9)';ctx.beginPath();ctx.arc(lx+lx*0.2-r*0.06,ey+ly-r*0.06,r*0.05,0,TAU);ctx.fill();}
    else{ctx.fillStyle=eyeC;ctx.fillRect(lx-r*0.3,ey-r*0.03,r*0.6,r*0.07);}
    return;
  }
  if(o.blink){
    ctx.fillStyle=eyeC;ctx.lineCap='round';
    ctx.fillRect(-ex-r*0.17+lx,ey-r*0.03,r*0.34,r*0.075);
    ctx.fillRect( ex-r*0.17+lx,ey-r*0.03,r*0.34,r*0.075);
    return;
  }
  // HD eye: sclera + iris + pupil + catchlight
  if(S.face==='bigeyes'||S.face===undefined||S.face==='dot'){
    const R=S.face==='bigeyes'?0.24:0.155;
    if(S.face==='bigeyes'){
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(-ex+lx,ey,r*R*1.3,0,TAU);ctx.arc(ex+lx,ey,r*R*1.3,0,TAU);ctx.fill();
      ctx.fillStyle=S.iris||'#2b6cff';
      ctx.beginPath();ctx.arc(-ex+lx*1.2,ey+ly,r*R*0.8,0,TAU);ctx.arc(ex+lx*1.2,ey+ly,r*R*0.8,0,TAU);ctx.fill();
    }
    ctx.fillStyle=eyeC;
    ctx.beginPath();ctx.arc(-ex+lx*1.2,ey+ly,r*R*(S.face==='bigeyes'?0.45:1),0,TAU);
    ctx.arc(ex+lx*1.2,ey+ly,r*R*(S.face==='bigeyes'?0.45:1),0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.beginPath();ctx.arc(-ex+lx*1.2-r*0.05,ey+ly-r*0.05,r*0.045,0,TAU);
    ctx.arc(ex+lx*1.2-r*0.05,ey+ly-r*0.05,r*0.045,0,TAU);ctx.fill();
    return;
  }
  if(S.face==='angry'){
    ctx.fillStyle=eyeC;
    ctx.beginPath();ctx.arc(-ex+lx,ey+r*0.04,r*0.15,0,TAU);ctx.arc(ex+lx,ey+r*0.04,r*0.15,0,TAU);ctx.fill();
    ctx.strokeStyle=eyeC;ctx.lineWidth=Math.max(1.4,r*0.08);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-ex-r*0.2+lx,ey-r*0.26);ctx.lineTo(-ex+r*0.16+lx,ey-r*0.12);
    ctx.moveTo(ex+r*0.2+lx,ey-r*0.26);ctx.lineTo(ex-r*0.16+lx,ey-r*0.12);ctx.stroke();
    return;
  }
  if(S.face==='glow'){
    ctx.save();ctx.shadowColor=S.a||'#4dffa6';ctx.shadowBlur=r*0.7;
    ctx.fillStyle=S.a||'#4dffa6';
    ctx.beginPath();ctx.arc(-ex+lx,ey+ly,r*0.14,0,TAU);ctx.arc(ex+lx,ey+ly,r*0.14,0,TAU);ctx.fill();
    ctx.restore();return;
  }
  if(S.face==='sleepy'){
    ctx.strokeStyle=eyeC;ctx.lineWidth=Math.max(1.4,r*0.08);ctx.lineCap='round';
    ctx.beginPath();ctx.arc(-ex+lx,ey+r*0.06,r*0.17,Math.PI*1.1,Math.PI*1.9);
    ctx.arc(ex+lx,ey+r*0.06,r*0.17,Math.PI*1.1,Math.PI*1.9);ctx.stroke();return;
  }
  if(S.face==='x'){
    ctx.strokeStyle=eyeC;ctx.lineWidth=Math.max(1.5,r*0.085);ctx.lineCap='round';
    for(const s of[-1,1]){
      ctx.beginPath();
      ctx.moveTo(s*ex-r*0.12+lx,ey-r*0.12);ctx.lineTo(s*ex+r*0.12+lx,ey+r*0.12);
      ctx.moveTo(s*ex+r*0.12+lx,ey-r*0.12);ctx.lineTo(s*ex-r*0.12+lx,ey+r*0.12);ctx.stroke();
    }
    return;
  }
  // fallback
  ctx.fillStyle=eyeC;
  ctx.beginPath();ctx.arc(-ex+lx,ey+ly,r*0.15,0,TAU);ctx.arc(ex+lx,ey+ly,r*0.15,0,TAU);ctx.fill();
}
function drawSkinMouth(S,r,o){
  if(S.face==='visorface'||S.face==='cyclops')return;
  const lx=clamp(o.look,-1,1)*r*0.28, ly=clamp(o.lookY,-1,1)*r*0.22;
  ctx.strokeStyle=S.eye||'#0a0a14';
  ctx.lineWidth=Math.max(1.5,r*0.09);ctx.lineCap='round';
  ctx.beginPath();
  if(o.mood==='hurt'){ctx.moveTo(-r*0.18+lx,r*0.34+ly);ctx.lineTo(r*0.18+lx,r*0.28+ly);}
  else if(o.mood==='hype'){ctx.arc(lx,r*0.2+ly,r*0.26,0.15*Math.PI,0.85*Math.PI);}
  else{ctx.arc(lx,r*0.22+ly,r*0.18,0.2*Math.PI,0.8*Math.PI);}
  ctx.stroke();
  if(S.fangs){
    ctx.fillStyle='#fff';
    for(const s of[-1,1]){
      ctx.beginPath();
      ctx.moveTo(s*r*0.16+lx,r*0.24+ly);ctx.lineTo(s*r*0.25+lx,r*0.24+ly);ctx.lineTo(s*r*0.2+lx,r*0.42+ly);
      ctx.closePath();ctx.fill();
    }
  }
}

/* ---------------- MAIN SKIN RENDERER ---------------- */
function drawSkinAt(x,y,r,S,o){
  o=o||{};
  const t=o.t||0;
  const sq=clamp(o.squish||0,-0.4,0.4);
  const rx=r*(1+sq),ry=r*(1-sq);
  ctx.save();ctx.translate(x,y);
  if(S.rot)ctx.rotate(Math.sin(t*1.4)*S.rot);
  // AURA
  (AURAS[S.aura]||AURAS.none)(S,r,t);
  // BODY
  (SHAPES[S.shape]||SHAPES.orb)(rx,ry,t);
  ctx.save();
  (SURFACES[S.surf]||SURFACES.gloss)(S,r,t);
  ctx.restore();
  // PATTERN (re-path so the clip is correct)
  if(S.pat&&S.pat!=='none'){
    (SHAPES[S.shape]||SHAPES.orb)(rx,ry,t);
    (PATTERNS[S.pat]||PATTERNS.none)(S,r,t);
  }
  // RIM LIGHT — the single biggest "HD" tell
  (SHAPES[S.shape]||SHAPES.orb)(rx,ry,t);
  ctx.save();ctx.clip();
  ctx.strokeStyle='rgba(255,255,255,0.5)';
  ctx.lineWidth=Math.max(1,r*0.1);
  (SHAPES[S.shape]||SHAPES.orb)(rx*0.99,ry*0.99,t);
  ctx.stroke();
  ctx.strokeStyle=hexA(S.c2,0.65);ctx.lineWidth=Math.max(1,r*0.16);
  ctx.save();ctx.translate(r*0.1,r*0.14);
  (SHAPES[S.shape]||SHAPES.orb)(rx*0.98,ry*0.98,t);ctx.stroke();ctx.restore();
  ctx.restore();
  // SPECULAR
  if(S.surf!=='neon'&&S.surf!=='void_'){
    ctx.save();
    (SHAPES[S.shape]||SHAPES.orb)(rx,ry,t);ctx.clip();
    ctx.globalAlpha=0.55;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(-r*0.34,-r*0.44,r*0.2,r*0.12,-0.6,0,TAU);ctx.fill();
    ctx.globalAlpha=0.28;
    ctx.beginPath();ctx.ellipse(-r*0.16,-r*0.56,r*0.08,r*0.05,-0.6,0,TAU);ctx.fill();
    ctx.restore();ctx.globalAlpha=1;
  }
  // FACE
  drawSkinFace(S,r,o);
  drawSkinMouth(S,r,o);
  // HAT
  (HATS[S.hat]||HATS.none)(S,r,t);
  ctx.restore();
}

/* ---------- dedupe + finalise ---------- */
(function(){
  const seen=new Set(),out=[];
  for(const a of ACH){if(seen.has(a.k))continue;seen.add(a.k);out.push(a);}
  ACH.length=0;Array.prototype.push.apply(ACH,out);
  // any skin reference that doesn't resolve is dropped rather than silently dead
  for(const a of ACH)if(a.s&&!SKIN_BY_ID[a.s])a.s=null;
})();
const ACH_BY_KEY={};for(const a of ACH)ACH_BY_KEY[a.k]=a;

/* legacy v1 badge keys map onto the new set so old saves keep their progress */
const LEGACY_MAP={hop10:'mr0',hop25:'mr2',score20k:'sc7',combo25:'cb4',untouch:'nh0',
  coin150:'cr3',cat:'h_cat',void:'h_void',triple:'h_allboss',marathon:'h_marathon',
  duelist:'h_duel',hall:'h_hall'};
(function reconcile(){
  for(const old of [...EARNED]){
    if(ACH_BY_KEY[old])continue;
    const mapped=LEGACY_MAP[old];
    EARNED.delete(old);
    if(mapped&&ACH_BY_KEY[mapped])EARNED.add(mapped);
  }
  writeSave('badges',[...EARNED]);
})();

function achProgress(){return EARNED.size+'/'+ACH.length;}
function unlockAch(key,quiet){
  if(EARNED.has(key))return false;
  const a=ACH_BY_KEY[key];if(!a)return false;
  EARNED.add(key);writeSave('badges',[...EARNED]);
  addBits(a.b,true);
  addXP(Math.round(a.b*0.8));
  if(a.s)ownSkin(a.s,true);
  if(!quiet)pushToast('🏅 '+a.n,a.d+(a.s?' · SKIN: '+SKIN_BY_ID[a.s].name:'')+' · +'+a.b+' ✦',
    a.s?RARITY_COL[SKIN_BY_ID[a.s].rar]:'#ffd94d');
  SFX.win();
  return true;
}
/* evaluated once per run end — 1000 cheap predicates, ~0.3ms */
function evalAchievements(run){
  let n=0;
  for(const a of ACH){
    if(!a.f||EARNED.has(a.k))continue;
    let ok=false;
    try{ok=!!a.f(run,ST);}catch(e){ok=false;}
    if(ok){unlockAch(a.k,n>=3);n++;}
  }
  if(n>3)pushToast('+'+(n-3)+' MORE BADGES','open BADGES to see them','#ffd94d');
  return n;
}

/* ---- diagnostics: every ad failure is recorded, never swallowed ---- */
ADS.log=[];
function adLog(msg,isErr){
  const line=(isErr?'! ':'  ')+msg;
  ADS.log.push(line); if(ADS.log.length>24)ADS.log.shift();
  try{console[isErr?'warn':'log']('[ads] '+msg);}catch(e){}
}
/* The Capacitor runtime is injected natively, but `Capacitor.Plugins.AdMob`
   only exists if something called registerPlugin('AdMob') — which normally
   happens inside the plugin's own JS module. This game is a single HTML file
   with no bundler, so nothing ever imported it and every ad call silently
   no-opped. Register it ourselves. */
function adPlugin(){
  if(ADS._plugin!==undefined)return ADS._plugin;
  const C=window.Capacitor;
  let p=null;
  if(!C){adLog('no Capacitor runtime (browser build)');ADS._plugin=null;return null;}
  const native=!!(C.isNativePlatform&&C.isNativePlatform());
  if(!native){adLog('Capacitor present but not a native platform');ADS._plugin=null;return null;}
  try{
    if(C.Plugins&&C.Plugins.AdMob){p=C.Plugins.AdMob;adLog('plugin via Capacitor.Plugins');}
    else if(typeof C.registerPlugin==='function'){p=C.registerPlugin('AdMob');adLog('plugin via registerPlugin');}
    else if(window.AdMob){p=window.AdMob;adLog('plugin via window.AdMob');}
  }catch(e){adLog('registerPlugin threw: '+e.message,true);p=null;}
  if(!p)adLog('AdMob plugin could not be resolved',true);
  ADS._plugin=p;
  return p;
}
async function adsInit(){
  const AdMob=adPlugin();
  if(!AdMob){ADS.ready=true;ADS.native=false;adLog('ads disabled: no plugin');return;}
  ADS.native=true;
  adLog('units b='+AD_UNITS.banner.slice(-10)+' i='+AD_UNITS.interstitial.slice(-10)+' r='+AD_UNITS.rewarded.slice(-10));
  try{
    await AdMob.initialize({initializeForTesting:ADS.testMode||AD_TEST_DEVICES.length>0,testingDevices:AD_TEST_DEVICES,tagForChildDirectedTreatment:false});
    // UMP / GDPR consent — required in the EEA & UK before any personalised request
    try{
      const info=await AdMob.requestConsentInfo({debugGeography:0});
      if(info&&info.isConsentFormAvailable&&info.status==='REQUIRED'){
        await AdMob.showConsentForm();
      }
      ADS.consent=(info&&info.status)||'unknown';
    }catch(e){ADS.consent='error';adLog('consent flow failed: '+(e&&e.message||e),true);}
    ADS.ready=true;adLog('initialized, consent='+ADS.consent);
    // pause the game for the full lifetime of any fullscreen ad
    const on=(ev,fn)=>{try{AdMob.addListener(ev,fn);}catch(e){}};
    on('interstitialAdOpened',()=>setPaused(true,'ad'));
    on('interstitialAdClosed',()=>{setPaused(false,'ad');adPreloadInter();});
    on('rewardedVideoAdOpened',()=>setPaused(true,'ad'));
    on('rewardedVideoAdClosed',()=>{setPaused(false,'ad');adFinishReward(false);adPreloadReward();});
    on('onRewardedVideoAdReward',()=>{ADS.rewardEarned=true;});
    on('rewardedVideoAdReward',()=>{ADS.rewardEarned=true;});
    adPreloadInter();adPreloadReward();
  }catch(e){adLog('initialize failed: '+(e&&e.message||e),true);ADS.ready=true;ADS.native=false;}
}
async function adPreloadInter(){
  const AdMob=adPlugin();if(!AdMob||ADS.removed)return;
  try{await AdMob.prepareInterstitial({adId:AD_UNITS.interstitial,isTesting:ADS.testMode});adLog('interstitial preloaded');}
  catch(e){adLog('interstitial preload: '+(e&&e.message||e),true);}
}
async function adPreloadReward(){
  const AdMob=adPlugin();if(!AdMob)return;
  try{await AdMob.prepareRewardVideoAd({adId:AD_UNITS.rewarded,isTesting:ADS.testMode});adLog('rewarded preloaded');}
  catch(e){adLog('rewarded preload: '+(e&&e.message||e),true);}
}
/* ---- banner: menus only, never over gameplay ---- */
async function adShowBanner(){
  const AdMob=adPlugin();

/* ---- interstitial: after a run, rate-limited ---- */
function adInterAllowed(){
  if(ADS.removed||!ADS.native)return false;
  const now=Date.now();
  return ADS.runsSinceInter>=3 && (now-ADS.lastInter)>90000;
}
async function adMaybeInterstitial(){
  ADS.runsSinceInter++;
  if(!adInterAllowed())return false;
  const AdMob=adPlugin();if(!AdMob)return false;
  try{
    ADS.lastInter=Date.now();ADS.runsSinceInter=0;
    await AdMob.showInterstitial();
    bump(ST,'adsWatched');saveStats();
    return true;
  }catch(e){adLog('interstitial show failed: '+(e&&e.message||e),true);adPreloadInter();return false;}
}
/* ---- rewarded: opt-in, always pays ---- */
function adFinishReward(force){
  const cb=ADS.pendingReward;
  if(!cb)return;
  ADS.pendingReward=null;
  const earned=!!ADS.rewardEarned||!!force;
  ADS.rewardEarned=false;
  try{cb(earned);}catch(e){}
}
async function adShowRewarded(cb){
  const AdMob=adPlugin();
  ADS.rewardEarned=false;
  if(!AdMob||!ADS.native){
    // no ad network available (browser / desktop build): grant it anyway
    // rather than dangling a button the player can never use
    cb(true);return;
  }
  ADS.pendingReward=cb;
  try{
    await AdMob.showRewardVideoAd();
    bump(ST,'adsWatched');saveStats();
  }catch(e){
    adLog('rewarded show failed: '+(e&&e.message||e),true);
    adPreloadReward();
    adFinishReward(true);
  }
}

/* ==================================================================
   PAUSE — required for ads, and a Play-review expectation anyway
   ================================================================== */
let PAUSED=false, pauseReason='';
function setPaused(on,reason){
  if(on===PAUSED&&reason===pauseReason)return;
  PAUSED=!!on;pauseReason=on?(reason||'user'):'';
  if(on){
    // a finger held down through the pause must not keep steering (audit 2-P1)
    IN.down=false;IN.pointerActive=false;IN.keys={};IN.pid=null;
    try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}
    flushStats(true);
  } else {
    try{if(AC&&AC.state==='suspended')AC.resume();}catch(e){}
    last=performance.now(); // no dt spike on resume
  }
}
function togglePause(){
  if(state!=='play')return;
  if(PAUSED&&pauseReason!=='user')return; // never let a tap dismiss an ad pause
  setPaused(!PAUSED,'user');
  SFX.whiff();
}

function scrollBegin(){SCROLL.drag=true;SCROLL.lastY=IN.py;SCROLL.startY=IN.py;SCROLL.moved=0;SCROLL.vel=0;}
function scrollUpdate(dt){
  if(SCROLL.drag){
    const d=IN.py-SCROLL.lastY;SCROLL.lastY=IN.py;
    SCROLL.y-=d;SCROLL.moved+=Math.abs(d);
    SCROLL.vel=-d/Math.max(dt,0.001)*0.016;
    if(!IN.down)SCROLL.drag=false;
  } else {
    SCROLL.y+=SCROLL.vel;SCROLL.vel*=Math.pow(0.001,dt);
    if(Math.abs(SCROLL.vel)<0.2)SCROLL.vel=0;
  }
  SCROLL.y=clamp(SCROLL.y,0,Math.max(0,SCROLL.max));
}

/* ======== MODULE 07_integrate.js ======== */
/* ==================================================================
   INTEGRATION — run tracking, new title screen, ad hooks, wrappers.
   Everything here wraps existing functions rather than editing them,
   so the original game logic stays exactly as audited.
   ================================================================== */

/* ---------- bottom safe-area inset (audit 2-P2: only top was handled) ---------- */
let SAFE_BOT_PX=0;
(function(){
  const p=document.createElement('div');
  p.style.cssText='position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden';
  document.body.appendChild(p);
  const meas=()=>{SAFE_BOT_PX=p.getBoundingClientRect().height||0;};
  meas();addEventListener('resize',meas);addEventListener('orientationchange',meas);
})();
let BANNER_H=0; // reserved for the menu banner ad
function SAFE_BOT(){return SAFE_BOT_PX+BANNER_H;}

/* ---------- seeded first cycle ----------
   The tutorial order (MODES[0..5], world 0, no mutator) is right for a
   brand-new player and wrong for everyone else: it made every Daily
   Challenge open identically regardless of the day's seed. Anyone past
   their third run — and every seeded run — now gets a rolled first cycle.
------------------------------------------- */
function rollFirstCycle(){
  if(!G)return;
  const veteran=(typeof ST==='object'&&ST&&ST.runs>=3);
  if(!(DAILY||(VSM&&VSM.stage>0)||veteran))return;
  const pool=[];
  for(let i=0;i<MODES.length;i++){
    const k=MODES[i].key;
    if(k==='pet'||k==='flux')continue;   // both are special-cased by nextMode
    pool.push(i);
  }
  for(let i=pool.length-1;i>0;i--){const j=randi(0,i);const t=pool[i];pool[i]=pool[j];pool[j]=t;}
  G.order=pool.slice(0,6);
  G.worldIdx=randi(0,WORLDS.length-1);
}

/* ---------- run summary ---------- */
let RUN=null;
function newRun(){
  return {score:0,coins:0,kills:0,morphs:0,bestCombo:0,cycle:0,hitsTaken:0,
    time:0,seen:[],heartsGained:0,heartsLeft:5,lowHeart:5,bossWins:0,
    wasDaily:false,wasSurv:false,wasVS:false,survTime:0,modeSeconds:{},continued:false};
}

/* ---------- wrap startGame: reset the run, hide the banner ---------- */
const _startGame=startGame;
startGame=function(seed){
  RUN=newRun();
  RUN.wasDaily=!!DAILY;RUN.wasSurv=!!SURV;RUN.wasVS=!!(VSM&&VSM.stage>0);
  setPaused(false,'');
  adHideBanner();
  _startGame(seed);
  RUN.heartsLeft=G.hearts;RUN.lowHeart=G.hearts;
};

/* ---------- wrap setMode: per-mode + per-world + affix tracking ---------- */
const _setMode=setMode;
setMode=function(m,fresh){
  _setMode(m,fresh);
  if(!RUN||!cur)return;
  bump(ST.modePlays,cur.key);
  if(RUN.seen.indexOf(cur.key)<0)RUN.seen.push(cur.key);
  const w=WORLD&&WORLD();
  if(w&&w.key)bump(ST.worldVisits,w.key);
  if(G&&G.affix&&G.affix.key){bump(ST.affixSeen,G.affix.key);bump(ST,'affixRuns');}
  saveStats();
};

/* ---------- wrap gainHeart / hurt for run stats ---------- */
const _gainHeart=gainHeart;
gainHeart=function(){
  const before=G?G.hearts:0;
  _gainHeart();
  if(G&&G.hearts>before&&RUN){RUN.heartsGained++;bump(ST,'totalHearts');}
};
const _hurt=hurt;
hurt=function(reason){
  _hurt(reason);
  if(G&&RUN)RUN.lowHeart=Math.min(RUN.lowHeart,G.hearts);
};

/* ---------- wrap quitToMenu: an abandoned run still banks its stats ---------- */
const _quitToMenu=quitToMenu;
quitToMenu=function(){
  if(state==='play'&&G&&RUN){
    commitRun(false);
    bump(ST,'quits');saveStats();
  }
  setPaused(false,'');
  _quitToMenu();
  resetScroll();
  adShowBanner();
};

/* ---------- commit a run's numbers into lifetime stats ---------- */
function commitRun(counted){
  if(!G||!RUN)return;
  RUN.score=G.score;RUN.coins=G.coins;RUN.kills=G.kills;RUN.morphs=G.morphs;
  RUN.bestCombo=G.bestCombo;RUN.cycle=G.cycle;RUN.hitsTaken=G.hitsTaken||0;
  RUN.time=G.t;RUN.heartsLeft=G.hearts;
  RUN.survTime=SURV?G.modeT:0;
  for(const k of (G.seen?[...G.seen]:[]))if(RUN.seen.indexOf(k)<0)RUN.seen.push(k);

  ST.totalScore+=G.score;ST.totalCoins+=G.coins;ST.totalKills+=G.kills;
  ST.totalMorphs+=G.morphs;ST.totalTime+=Math.round(G.t);
  ST.bestScore=Math.max(ST.bestScore,G.score);
  ST.bestCombo=Math.max(ST.bestCombo,G.bestCombo);
  ST.bestCycle=Math.max(ST.bestCycle,G.cycle);
  if(SURV)ST.bestSurvTime=Math.max(ST.bestSurvTime,Math.round(G.modeT));
  if(cur&&cur.key)ST.modeBest[cur.key]=Math.max(ST.modeBest[cur.key]||0,G.score);
  if(RUN.hitsTaken===0&&G.cycle>=1)bump(ST,'noHitRuns');
  if(counted){
    bump(ST,'runs');bump(ST,'deaths');
    if(RUN.wasDaily){
      const today=todayIdx();
      if(ST.lastDaily!==today){
        ST.dailyStreak=(today-ST.lastDaily===1)?ST.dailyStreak+1:1;
        ST.dailyBestStreak=Math.max(ST.dailyBestStreak,ST.dailyStreak);
        ST.lastDaily=today;bump(ST,'dailyDone');
      }
    }
  }
  // XP + mastery: rewards time spent, not just score
  const xp=Math.round(G.score*0.02+G.morphs*8+G.t*0.6+G.bestCombo*2);
  addXP(xp);
  const perMode=Math.round(xp/Math.max(1,RUN.seen.length));
  for(const k of RUN.seen)if(MODE_BY_KEY[k])addModeXP(k,perMode);
  const bits=Math.round(G.score*0.012+G.coins*0.7+G.morphs*3+RUN.bossWins*40);
  addBits(bits,true);
  RUN.bitsEarned=bits;
  saveStats();flushStats(true);
}

/* ---------- REWARDED CONTINUE ----------
   Offered once per run. Restores hearts, clears the killing hazard,
   and un-freezes a boss fight that already called finish().
------------------------------------------- */
let continueOffer=null;
function canOfferContinue(){
  return !!(G&&RUN&&!RUN.continued&&G.score>=300&&!VSM);
}
function doContinue(){
  if(!G||!RUN)return;
  RUN.continued=true;bump(ST,'continues');saveStats();
  G.hearts=2;G.invuln=3;G.combo=0;G.shield=true;
  state='play';overT=0;
  // a boss that already finished is frozen — re-seed or let it morph out
  if(cur&&BOSSES.includes(cur)&&cur.done){
    if(typeof cur.morphIn==='number'&&cur.morphIn>0){/* countdown already running */}
    else if(morphT<=0)beginMorph();
  } else if(cur&&cur.enter){
    // generic hazard clear: re-seed the mode so nothing is still overlapping you
    try{cur.enter(false);}catch(e){}
  }
  say("second wind. the genres blinked first.",2.6);
  SFX.win();confetti(P.x,P.y);
  adHideBanner();
}

/* ---------- wrap gameOver ---------- */
const _gameOver2=gameOver;
gameOver=function(){
  const wasVSHand=!!(VSM&&VSM.stage===1);
  commitRun(true);
  _gameOver2();  // the original wrapper: quips, stats line, legacy achievement pass, VS routing
  if(!GOD&&RUN){
    checkContracts(RUN);
    evalAchievements(RUN);
    if(RUN.wasVS)bump(ST,'vsMatches');
    flushStats(true);
  }
  continueOffer=canOfferContinue()?{t:0}:null;
  if(state==='over'||state==='vsresult'){
    adShowBanner();
    if(!wasVSHand)adMaybeInterstitial();
  }
};

/* ---------- title press: new buttons ---------- */
titlePress=function(fromKey){
  if(!fromKey){
    if(inZone(TZ.single)){openPick();return;}
    if(inZone(TZ.vs)){startVS();return;}
    if(inZone(TZ.ranks)){openBoard();return;}
    if(inZone(TZ.daily)){startDaily();return;}
    if(TZ.bonus&&inZone(TZ.bonus)){claimBonusHeart();return;}
    if(inZone(TZ.profile)){openProfile();return;}
    if(inZone(TZ.badges)){openBadges();return;}
    if(inZone(TZ.skins)){openSkins();return;}
    if(TZ.god&&inZone(TZ.god)){GOD=!GOD;SFX.heart();return;}

    return; // taps on empty space no longer start a run by accident
  }
  VSM=null;SURV=null;DAILY=false;startGame();
};

/* ---------- press dispatch for the new states ---------- */
const _doPress=doPress;
doPress=function(fromKey){
  if(state==='badges'){ensureAudio();if(!fromKey)badgesPress();else{state='title';resetScroll();}return;}
  if(state==='skins'){ensureAudio();if(!fromKey)skinsPress();else{state='title';resetScroll();}return;}
  if(state==='profile'){ensureAudio();if(!fromKey)profilePress();else{state='title';resetScroll();}return;}
  if(state==='play'&&PAUSED){
    ensureAudio();
    if(pauseReason==='ad')return;
    if(!fromKey){
      if(inZone(PZ.resume)){setPaused(false,'');return;}
      if(inZone(PZ.mute)){toggleMute();return;}
      if(inZone(PZ.quit)){setPaused(false,'');quitToMenu();return;}
      return;
    }
    setPaused(false,'');return;
  }
  if(state==='play'&&!fromKey&&inZone(MZ.pause)){togglePause();return;}
  if(state==='over'&&continueOffer&&continueOffer.t>0.4&&!fromKey&&inZone(OZ.cont)){doContinue();return;}
  _doPress(fromKey);
};

      return;
    }
    if(state==='entry'){cancelEntry();return;}
    if(state==='over'){state='title';titleSub=vchoose(TITLE_SUBS);adShowBanner();return;}
    state='title';titleSub=vchoose(TITLE_SUBS);resetScroll();
  });
  // pause on app background; AdMob overlays do NOT always fire visibilitychange
  App.addListener('appStateChange',s=>{
    if(!s.isActive){if(state==='play'&&!PAUSED)setPaused(true,'user');flushStats(true);}
  });
})();
let titleBackArm=0;

/* ---------- reduce-flashing accessibility toggle (audit 6-P2) ---------- */
let REDUCE_FX=loadTyped('reducefx',
  (window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?1:0,'number')?true:false;
function toggleReduceFX(){REDUCE_FX=!REDUCE_FX;writeSave('reducefx',REDUCE_FX?1:0);}

/* ---------- keyboard shortcuts for the new screens ---------- */
addEventListener('keydown',e=>{
  if(state==='title'){
    if(e.code==='KeyB'){e.preventDefault();openBadges();}
    else if(e.code==='KeyK'){e.preventDefault();openSkins();}
    else if(e.code==='KeyP'){e.preventDefault();openProfile();}
  }
  else if(e.code==='KeyP'&&state==='play'){e.preventDefault();togglePause();}
  else if(e.code==='Escape'&&(state==='badges'||state==='skins'||state==='profile')){
    e.preventDefault();state='title';resetScroll();
  }
});

/* ---------- boot the ad layer ---------- */
adsInit().then(()=>{if(state!=='play')adShowBanner();});
addEventListener('pagehide',()=>flushStats(true));
addEventListener('beforeunload',()=>flushStats(true));


/* ======== MODULE 08_final.js ======== */
/* ==================================================================
   FINAL GLUE — runs after the original file-end gameOver wrapper, so
   this is the outermost layer and sees the settled state.
   ================================================================== */

/* ---------- the player now wears the equipped skin ---------- */
drawBit=function(x,y,r,opts){
  const S=curSkin();
  const inv=G&&G.invuln>0&&Math.floor(G.invuln*(REDUCE_FX?5:14))%2===0;
  if(inv)ctx.globalAlpha=0.35;
  drawSkinAt(x,y,r,S,{
    t:performance.now()/1000,
    look:P.look,lookY:P.lookY,squish:P.squish,
    blink:P.blink>0&&P.blink<0.12,
    mood:(G&&G.invuln>1.2)?'hurt':((G&&G.combo>=10)?'hype':'idle')
  });
  ctx.globalAlpha=1;
  if(G&&G.shield&&state==='play'){
    ctx.save();ctx.translate(x,y);
    ctx.strokeStyle='rgba(110,231,255,0.7)';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(0,0,r*1.6,0,TAU);ctx.stroke();
    ctx.restore();
  }
};

/* ---------- post-run ad gate: deferred a frame so VS routing has settled ---------- */
let postRunPending=0;
function runPostRunAds(){
  if(state==='over'||state==='vsresult'||state==='board'){
    adShowBanner();
    if(state!=='vshand')adMaybeInterstitial();
  }
}

/* ---------- outermost gameOver: schedule the ad gate ---------- */
const _goFinal=gameOver;
gameOver=function(){
  _goFinal();
  postRunPending=0.08;
};

/* ---------- the shield promised by the daily bonus ---------- */
const _sgFinal=startGame;
startGame=function(seed){
  _sgFinal(seed);
  if(BONUS_SHIELD&&G){G.shield=true;BONUS_SHIELD=false;
    say("daily bonus: one free hit. use it badly.",2.6);}
};

/* ---------- game-over screen: continue offer + run rewards ---------- */
const _drawOver=drawOver;
drawOver=function(t){
  _drawOver(t);
  const u=UIS();
  ctx.textAlign='center';ctx.textBaseline='middle';
  // what the run paid out
  if(RUN&&RUN.bitsEarned){
    ctx.font=`700 ${11*u}px -apple-system,system-ui,sans-serif`;
    ctx.fillStyle='#ffd94d';
    ctx.fillText('+'+RUN.bitsEarned+' ✦   ·   rank '+ST.rank,W/2,H*0.46+18);
  }
  if(continueOffer&&overT>0.4){
    const bw=Math.min(W*0.72,300),bx=W/2-bw/2;
    const y=H*0.53;
    OZ.cont={x:bx,y,w:bw,h:52};
    const a=0.55+0.45*Math.sin(t*5);
    ctx.fillStyle='rgba(77,255,166,0.12)';roundRect(bx,y,bw,52,10);ctx.fill();
    ctx.strokeStyle='#4dffa6';ctx.lineWidth=2.5;ctx.globalAlpha=a;
    roundRect(bx,y,bw,52,10);ctx.stroke();ctx.globalAlpha=1;
    ctx.font=`800 ${13*u}px -apple-system,system-ui,sans-serif`;
    ctx.fillStyle='#4dffa6';ctx.fillText('▶  WATCH AD — KEEP GOING',W/2,y+20);
    ctx.font=`600 ${10*u}px -apple-system,system-ui,sans-serif`;
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillText('2 hearts + a shield · once per run',W/2,y+38);
  } else OZ.cont=null;
};

/* ---------- the continue itself goes through a rewarded ad ---------- */
const _doContinueRaw=doContinue;
doContinue=function(){
  const offer=continueOffer;
  if(!offer)return;
  continueOffer=null;
  adShowRewarded(earned=>{
    if(earned)_doContinueRaw();
    else{continueOffer=offer;pushToast('NO AD AVAILABLE','try again in a moment','#ff4d6d');}
  });
};

/* ---------- banner visibility follows the state machine ---------- */
let _lastAdState=null;
(function watchState(){
  const tick=()=>{
    if(state!==_lastAdState){
      _lastAdState=state;
      if(state==='play')adHideBanner();
      else adShowBanner();
    }
    setTimeout(tick,400);
  };
  tick();
})();

/* ---------- gift / ghost counters for the secret badges ---------- */
if(typeof EV==='object'&&EV){
  const _upd=updateEvents;
  updateEvents=function(dt,t){
    const hadGift=!!(EV.gift&&!EV.gift.opened);
    const hadGhost=!!EV.ghost;
    _upd(dt,t);
    if(hadGift&&(!EV.gift||EV.gift.opened)){bump(ST,'giftsOpened');saveStats();}
    if(hadGhost&&!EV.ghost){bump(ST,'ghostsCaught');saveStats();}
  };
}

/* ---------- boss-win bookkeeping for the three original bosses ---------- */
for(const B of [ModeBoss,ModeCursor,ModeWorm]){
  if(!B||typeof B.finish!=='function')continue;
  const _f=B.finish.bind(B);
  B.finish=function(won){
    const first=!this.done;
    _f(won);
    if(won&&first){
      if(RUN)RUN.bossWins=(RUN.bossWins||0)+1;
      bump(ST,'bossKills');bump(ST.bossBeats,B.key);saveStats();
    }
  };
}

/* ---------- hall-of-fame bookkeeping ---------- */
const _addToBoard=addToBoard;
addToBoard=function(name,score,tag){
  const i=_addToBoard(name,score,tag);
  bump(ST,'hallEntries');
  if(i===0)bump(ST,'hallFirsts');
  saveStats();
  return i;
};

/* ---------- flush periodically so a hard kill never loses progress ---------- */
setInterval(()=>flushStats(false),20000);

/* ---------- sanity: everything the modules promised actually exists ---------- */
(function selfCheck(){
  const missing=[];
  for(const k of MODE_KEYS)if(!SCALES[k])missing.push('SCALES.'+k);
  for(const k of MODE_KEYS)if(ROOTS[k]===undefined)missing.push('ROOTS.'+k);
  for(const k of MODE_KEYS)if(!QUIPS[k])missing.push('QUIPS.'+k);
  for(const a of ACH)if(a.s&&!SKIN_BY_ID[a.s])missing.push('skin:'+a.s);
  if(missing.length&&typeof console!=='undefined'&&window.__TWG_DEBUG)
    console.warn('TWG selfcheck',missing);
  window.__TWG={ACH,SKINS,ST,MODE_KEYS,missing,
    counts:{ach:ACH.length,skins:SKINS.length,modes:MODES.length,bosses:BOSSES.length,worlds:WORLDS.length}};
})();

</script>
